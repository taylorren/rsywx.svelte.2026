<svg xmlns="http://www.w3.org/2000/svg" width="480" height="44" viewBox="0 0 480 44">
  <!-- Faint wood shelf board (continuous so the tile repeats seamlessly) -->
  <g opacity="0.9">
    <rect x="0" y="34" width="480" height="10" fill="#cfbea0"/>
    <rect x="0" y="34" width="480" height="2" fill="#bfa98a"/>
    <line x1="0" y1="30" x2="480" y2="30" stroke="#bda98a" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="27" x2="480" y2="27" stroke="#bda98a" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Book cluster A -->
  <g opacity="0.95">
    <rect x="22" y="13" width="13" height="21" rx="1.5" fill="#b98d6b"/>
    <rect x="25" y="13" width="1.5" height="21" fill="#e6cdb2" opacity="0.6"/>
    <rect x="40" y="9" width="12" height="25" rx="1.5" fill="#8c7b64"/>
    <rect x="43" y="9" width="1.5" height="25" fill="#d9cbb3" opacity="0.5"/>
    <rect x="57" y="15" width="10" height="19" rx="1.5" fill="#a97f6f"/>
    <rect x="72" y="11" width="12" height="23" rx="1.5" fill="#9b8a6d"/>
    <rect x="89" y="16" width="9" height="18" rx="1.5" fill="#8fa07f"/>
    <rect x="102" y="12" width="12" height="22" rx="1.5" fill="#b7a37c"/>
    <rect x="118" y="17" width="8" height="17" rx="1.5" fill="#a08a72"/>
    <rect x="130" y="10" width="11" height="24" rx="1.5" fill="#a97f6f" transform="rotate(3 135 10)"/>
  </g>

  <!-- Book cluster B (kept clear of the tile edges so it repeats cleanly) -->
  <g opacity="0.95">
    <rect x="318" y="14" width="12" height="20" rx="1.5" fill="#8fa07f"/>
    <rect x="335" y="10" width="11" height="24" rx="1.5" fill="#b98d6b"/>
    <rect x="351" y="16" width="9" height="18" rx="1.5" fill="#b7a37c"/>
    <rect x="365" y="12" width="12" height="22" rx="1.5" fill="#8c7b64"/>
    <rect x="381" y="15" width="10" height="19" rx="1.5" fill="#a08a72"/>
    <rect x="396" y="11" width="11" height="23" rx="1.5" fill="#9b8a6d"/>
    <rect x="411" y="17" width="8" height="17" rx="1.5" fill="#a97f6f"/>
    <rect x="423" y="13" width="11" height="21" rx="1.5" fill="#8fa07f" transform="rotate(-2 429 13)"/>
  </g>
</svg>
